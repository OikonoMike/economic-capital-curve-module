<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кривые</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <h1>Кривые</h1>

    <div class="controls">
        <label for="dateInput">Выберите дату:</label>
        <input type="date" id="dateInput">
        <button id="loadBtn">Получить данные</button>

        <label for="scenarioSelect" style="margin-left: 16px;">Сценарий:</label>
        <select id="scenarioSelect">
            <option value="all">Все сценарии</option>
        </select>
    </div>

    <div id="message" class="message"></div>

    <h2>Результаты</h2>
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Сценарий</th>
                <th>Тенор</th>
                <th>Срок (лет)</th>
                <th>Ставка, %</th>
                <th>DF</th>
                <th>Метод</th>
                <th>Интерп.</th>
                <th>Экстрап.</th>
                <th>Время расчёта</th>
                <th>Тип запуска</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="downloads">
        <button id="downloadCsv">Скачать CSV</button>
        <button id="downloadExcel">Скачать Excel</button>
    </div>

    <h2>История запусков</h2>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Дата</th>
                <th>Тип</th>
                <th>Статус</th>
                <th>Время</th>
                <th>Ошибка</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>График кривых</h2>
    <canvas id="curveChart" width="800" height="400"></canvas>

    <script src="main.js"></script>
</body>
</html>
